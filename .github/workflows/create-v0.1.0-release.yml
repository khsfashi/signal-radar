name: verify-v0.1.0-release

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,targetCommitish,url
